name: Update flight status

# Near-real-time feed: each run loops for ~50 minutes, fetching FAA status + headlines
# every 60 seconds and force-pushing the app and data to the `live` branch whenever
# anything changes (plus a heartbeat every 10 minutes). Before finishing, each run starts
# the next one itself (GitHub's schedule is unreliable), until RUN_UNTIL. To stop early,
# cancel the running workflow or disable it under the repo's Actions tab.

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: ["claude/flight-comms-grounding-app-xfh46y", "main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  RUN_UNTIL: "2026-11-17T00:00:00Z"   # stop self-restarting after this time (UTC)

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and publish every 60 seconds
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "flight-status-bot"
          git config --global user.email "flight-status-bot@users.noreply.github.com"
          publish() {
            rm -rf /tmp/site && cp -r app /tmp/site && cd /tmp/site
            git init -q -b live && git add -A
            git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -qf "$REMOTE" live || echo "push failed"
            cd - >/dev/null
          }
          end=$((SECONDS + 50*60)); last=""; lastpush=-9999
          while [ $SECONDS -lt $end ]; do
            python scripts/fetch_status.py || true
            h=$(jq -S 'del(.generated)' app/data/status.json | sha256sum | cut -c1-16)
            if [ "$h" != "$last" ] || [ $((SECONDS - lastpush)) -ge 600 ]; then
              publish && last=$h && lastpush=$SECONDS && echo "published $h"
            fi
            sleep 60
          done
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$RUN_UNTIL" +%s)" ]; then
            gh workflow run update.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" && echo "next run queued"
          else
            echo "Past RUN_UNTIL; not restarting"
          fi
