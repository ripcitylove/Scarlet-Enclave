name: Update flight status

# Every run fetches fresh FAA status + headlines and force-pushes the app and data
# to the `live` branch (one commit, no history buildup). The app is served from that
# branch, so no GitHub Pages settings are needed.

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may run this less often under load (often every 5-15 min)
  push:
    branches: ["claude/flight-comms-grounding-app-xfh46y", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch FAA status and headlines
        run: python scripts/fetch_status.py
      - name: Publish app + data to the live branch
        run: |
          cd app
          git init -q -b live
          git config user.name "flight-status-bot"
          git config user.email "flight-status-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live
